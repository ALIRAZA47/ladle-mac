<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Ladle app icon, full detail: a molten arrow pouring into a steel ladle on a graphite squircle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34302B"/>
      <stop offset="0.55" stop-color="#1B1917"/>
      <stop offset="1" stop-color="#0E0D0C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A1F" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF8A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F3F5"/>
      <stop offset="0.55" stop-color="#A9B0B8"/>
      <stop offset="1" stop-color="#6A7179"/>
    </linearGradient>
    <radialGradient id="molten" cx="0.5" cy="0.45" r="0.6">
