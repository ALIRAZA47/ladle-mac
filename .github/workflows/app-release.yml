# Releases Ladle when a version tag like v1.2.0 is pushed, or when it's run by hand from the Actions
# tab on main with a version (the release then creates the tag). app/RELEASING.md has the steps and
# the one-time setup. The workflow never commits: main requires pull requests.
#
#   1. check:       the tag, the release notes (site/src/content/changelog/X.Y.Z.md), and Sparkle's
#                   keys: a real SUPublicEDKey and the SPARKLE_ED_PRIVATE_KEY secret that belongs to
#                   it. Picks the signing: ad hoc, or Developer ID when all six Apple secrets exist.
#                   Fails before any build if something is missing.
#   2. release:     app/scripts/package-app.sh builds for Apple silicon and Intel, signs, makes
#                   Ladle.dmg and Ladle-Chrome-Extension.zip, and signs the DMG for Sparkle;
#                   verify-package.sh checks the result; then the GitHub Release vX.Y.Z gets
#                   Ladle.dmg, Ladle-Chrome-Extension.zip and sparkle.json.
#   3. deploy-site: starts Site deploy on main, which rebuilds the update feed from the releases.
name: App release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 1.2.0. Publishing tags this commit of main as v1.2.0.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  check:
    name: Check the release can go out
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      signing: ${{ steps.signing.outputs.signing }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="v${INPUT_VERSION#v}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release versions look like 1.2.0 (tag v1.2.0), not ${tag}."
            exit 1
          fi
          tags=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Run by hand: the release tags this commit when it's published, so check that's
            # possible before building anything.
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Run App release on main, not ${GITHUB_REF_NAME}."
              exit 1
            fi
            existing=$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::${tag} already tags another commit (${existing}). Release a newer version."
              exit 1
            fi
            newest=$(printf '%s\n' "$tags" | sed '/^$/d' | sort -V | tail -n 1)
            if [ -z "$existing" ] && [ -n "$newest" ] \
              && [ "$(printf '%s\n%s\n' "$newest" "$tag" | sort -V | tail -n 1)" != "$tag" ]; then
              echo "::error::${tag} isn't newer than ${newest}. Versions go up, because the build number follows them."
              exit 1
            fi
          fi
          # The build number (CFBundleVersion, which Sparkle compares) is this tag's place among
          # the release tags in version order, so v0.1.0 is build 1.
          build=$(printf '%s\n%s\n' "$tags" "$tag" | sed '/^$/d' | sort -V -u \
            | awk -v tag="$tag" '$0 == tag { print NR; exit }')
          echo "Ladle $version, build $build"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Check the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="site/src/content/changelog/${VERSION}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Write the release notes in $notes before tagging v${VERSION}. See app/RELEASING.md."
            exit 1
          fi
          python3 app/scripts/publish_release.py check-notes "$notes" "$VERSION"

      - name: Check Sparkle's keys
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          public_key=$(python3 -c 'import plistlib; print(plistlib.load(open("app/Ladle/Info.plist", "rb"))["SUPublicEDKey"])')
          case "$public_key" in
            "" | REPLACE_WITH*)
              echo "::error file=app/Ladle/Info.plist::Put your Sparkle public key in SUPublicEDKey first. See app/RELEASING.md."
              exit 1 ;;
          esac
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::The SPARKLE_ED_PRIVATE_KEY secret isn't set. See app/RELEASING.md."
            exit 1
          fi
          if ! derived=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | python3 app/scripts/sparkle_ed.py public-key -); then
            echo "::error::SPARKLE_ED_PRIVATE_KEY isn't a Sparkle private key (export it with generate_keys -x)."
            exit 1
          fi
          if [ "$derived" != "$public_key" ]; then
            echo "::error file=app/Ladle/Info.plist::SPARKLE_ED_PRIVATE_KEY doesn't belong to SUPublicEDKey, so Ladle would refuse the update."
            exit 1
          fi
          echo "Sparkle's keys match: $public_key"

      - name: Choose the signing
        id: signing
        env:
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          missing=()
          for name in DEVELOPER_ID_CERT_P12_BASE64 DEVELOPER_ID_CERT_PASSWORD APPLE_TEAM_ID \
                      ASC_API_KEY_P8_BASE64 ASC_API_KEY_ID ASC_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Signing with Developer ID and notarizing."
            echo "signing=developer-id" >> "$GITHUB_OUTPUT"
          else
            if [ "${#missing[@]}" -lt 6 ]; then
              echo "::warning::Some Developer ID secrets are set, but not ${missing[*]}, so this release is signed ad hoc."
            fi
            echo "Signing ad hoc; people approve the first launch once."
            echo "signing=adhoc" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build, sign and publish
    needs: check
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      LADLE_VERSION: ${{ needs.check.outputs.version }}
      LADLE_BUILD: ${{ needs.check.outputs.build }}
      LADLE_OUT: ${{ github.workspace }}/app/build/package
      SIGNING: ${{ needs.check.outputs.signing }}
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Developer ID signing and notarization
        if: needs.check.outputs.signing == 'developer-id'
        env:
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$DEVELOPER_ID_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -m 1 'Developer ID Application' | sed -E 's/.*"(.+)"$/\1/')
          if [ -z "$identity" ]; then
            echo "::error::DEVELOPER_ID_CERT_P12_BASE64 holds no Developer ID Application certificate."
            exit 1
          fi
          case "$identity" in
            *"($APPLE_TEAM_ID)") ;;
            *) echo "::error::The Developer ID certificate ($identity) isn't for the team in APPLE_TEAM_ID."; exit 1 ;;
          esac
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "LADLE_SIGN_IDENTITY=$identity"
            echo "LADLE_KEYCHAIN=$keychain"
            echo "LADLE_NOTARIZE=1"
            echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "ASC_API_KEY_ID=$ASC_API_KEY_ID"
            echo "ASC_API_ISSUER_ID=$ASC_API_ISSUER_ID"
          } >> "$GITHUB_ENV"
          echo "Signing as $identity"

      - name: Build and package
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          key="$RUNNER_TEMP/sparkle_ed_private_key"
          (umask 077 && printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          LADLE_SPARKLE_KEY_FILE="$key" app/scripts/package-app.sh

      - name: Check the package
        run: app/scripts/verify-package.sh

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          # The release notes without their front matter.
          awk 'n >= 2 { print } /^---[[:space:]]*$/ && n < 2 { n++ }' "site/src/content/changelog/${LADLE_VERSION}.md" > "$notes"
          if [ "$SIGNING" = adhoc ]; then
            printf '\nOpening Ladle for the first time? macOS asks you to approve it once: https://ladle.alirazakhan.me/docs/getting-started/install/#first-launch\n' >> "$notes"
          fi
          assets=("$LADLE_OUT/Ladle.dmg" "$LADLE_OUT/Ladle-Chrome-Extension.zip" "$LADLE_OUT/sparkle.json")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "Ladle $LADLE_VERSION" --notes-file "$notes" \
              --draft=false --prerelease=false --latest
          else
            # A pushed tag must already exist; a run by hand creates it on this commit. A tag made
            # with GITHUB_TOKEN starts no second run.
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              tag_args=(--target "$GITHUB_SHA")
            else
              tag_args=(--verify-tag)
            fi
            gh release create "$TAG" "${assets[@]}" "${tag_args[@]}" \
              --title "Ladle $LADLE_VERSION" --notes-file "$notes" --latest
          fi

      - name: Remove the signing keychain
        if: always() && needs.check.outputs.signing == 'developer-id'
        run: |
          if [ -n "${LADLE_KEYCHAIN:-}" ]; then security delete-keychain "$LADLE_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  deploy-site:
    name: Deploy the website
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # A workflow_dispatch made with GITHUB_TOKEN starts a run (a push wouldn't). The deploy runs
      # on main and rebuilds appcast.xml from the published releases, this one included.
      - name: Start Site deploy on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site-deploy.yml --ref main -R "$GITHUB_REPOSITORY"
