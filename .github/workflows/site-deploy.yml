# Builds the website and publishes it to GitHub Pages at https://ladle.alirazakhan.me.
#
# Runs on pushes to main that touch site/ or the feed script, and by hand from the Actions tab,
# which is how the app's release workflow starts it after publishing a release (`gh workflow run`).
#
# Every deploy rebuilds the update feed (site/public/appcast.xml) and the missing release dates
# from the published GitHub Releases, in this checkout only; nothing is committed. That step
# belongs to the app side (app/scripts/publish_release.py, see SPEC.md "Release flow").
name: Site deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-deploy.yml'
      - 'app/scripts/publish_release.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued deploy waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # The update feed and release dates come from the published releases. If GitHub can't be
      # reached, this fails the deploy rather than publish an empty feed.
      - name: Build the update feed from the published releases
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 app/scripts/publish_release.py feed
          --repo "$GITHUB_REPOSITORY"
          --appcast site/public/appcast.xml
          --changelog site/src/content/changelog

      - run: npm run build

      # Reported here, but not allowed to hold back a release's update feed. Site CI enforces it.
      - name: Check links
        run: npm run check
        continue-on-error: true

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
