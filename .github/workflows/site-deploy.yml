# Builds the website and publishes it to GitHub Pages at https://ladle.alirazakhan.me.
#
# Runs on pushes to main that touch site/, by hand from the Actions tab, or from another
# workflow. Pushes made with the default GITHUB_TOKEN don't start other workflows, so the app's
# release workflow should call this one after it commits a new site/public/appcast.xml:
#
#   deploy-site:
#     needs: <the job that commits appcast.xml>
#     permissions: { contents: read, pages: write, id-token: write }
#     uses: ./.github/workflows/site-deploy.yml
#
# When called this way it checks out the latest main, which includes the new appcast.
name: Site deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch or commit to deploy. Defaults to main, so a release that just committed appcast.xml deploys it.
        type: string
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued deploy waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          # Empty for pushes and manual runs (the triggering commit); `main` when called by a release.
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - run: npm run build

      # Reported here, but not allowed to hold back a release's update feed. Site CI enforces it.
      - name: Check links
        run: npm run check
        continue-on-error: true

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
