# Builds and tests the app on every push and pull request that touches app/:
# LadleKit's tests on Linux and macOS, an unsigned build of the app with its tests, the
# browser extension's tests in Chromium, and the release scripts' tests. On main and on pull
# requests it also packages Ladle exactly the way a release does, as a dry run.
name: App CI

on:
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'site/public/install.sh'
      - '.github/workflows/app-*.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'site/public/install.sh'
      - '.github/workflows/app-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: App (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Only GitHub's own actions run here (the release workflow holds a signing key, and this one
      # mirrors it), so Xcode is picked by hand from what the runner image ships.
      - name: Select the newest stable Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app 2> /dev/null | grep -iv beta | sort -V | tail -n 1 || true)
          [ -n "$xcode" ] || xcode=/Applications/Xcode.app
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test LadleKit
        run: swift test --package-path app/LadleKit

      - name: Generate the Xcode project
        working-directory: app
        run: xcodegen generate

      # Signed to run locally only. Keeps compiling past the first error, so one run reports
      # every error.
      - name: Build and test the app (unsigned)
        working-directory: app
        run: |
          set -o pipefail
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          xcodebuild \
            -project Ladle.xcodeproj \
            -scheme Ladle \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO \
            build test

      - name: Check the app bundle
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug/Ladle.app"
          test -x "$app/Contents/MacOS/LadleBridge"
          test -f "$app/Contents/PlugIns/SafariExtension.appex/Contents/Resources/manifest.json"
          test -f "$app/Contents/PlugIns/SafariExtension.appex/Contents/Resources/background.js"
          test -d "$app/Contents/Frameworks/Sparkle.framework"
          /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$app/Contents/Info.plist"

  linux:
    name: LadleKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v7
      - name: Test LadleKit
        run: swift test --package-path app/LadleKit

  extension:
    name: Browser extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/BrowserExtension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/BrowserExtension/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests in Chromium
        run: npm run test:browser
      - name: Build every browser's copy
        run: npm run build

  scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test publish_release.py and sparkle_ed.py
        run: python3 -m unittest discover -s app/scripts -p 'test_*.py' -v
      - name: Check the packaging scripts' syntax
        run: for script in app/scripts/*.sh; do bash -n "$script"; done
      - name: Lint the website's install script
        run: |
          bash -n site/public/install.sh
          shellcheck --shell=bash site/public/install.sh

  # The release's packaging path (app/scripts/package-app.sh), with a throwaway Sparkle key made
  # here: a universal Release build signed ad hoc inside out, Ladle.dmg, the Chrome extension zip
  # and the update's EdDSA signature, then verify-package.sh checks it all from the mounted DMG.
  package:
    name: Packaging dry run
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-latest
    env:
      LADLE_OUT: ${{ github.workspace }}/app/build/package
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest stable Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app 2> /dev/null | grep -iv beta | sort -V | tail -n 1 || true)
          [ -n "$xcode" ] || xcode=/Applications/Xcode.app
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Pick a version and a throwaway Sparkle key
        run: |
          version=$(sed -nE 's/^ *MARKETING_VERSION: *"?([0-9]+\.[0-9]+\.[0-9]+)"?.*/\1/p' app/project.yml | head -n 1)
          key="$RUNNER_TEMP/throwaway_sparkle_key"
          public_key=$(python3 app/scripts/sparkle_ed.py generate "$key")
          {
            echo "LADLE_VERSION=$version"
            echo "LADLE_BUILD=$GITHUB_RUN_NUMBER"
            echo "LADLE_SPARKLE_KEY_FILE=$key"
            echo "LADLE_PUBLIC_ED_KEY_OVERRIDE=$public_key"
          } >> "$GITHUB_ENV"
          echo "Ladle $version ($GITHUB_RUN_NUMBER), throwaway SUPublicEDKey $public_key"

      - name: Build and package, ad hoc like a release
        run: app/scripts/package-app.sh

      - name: Check the package
        run: app/scripts/verify-package.sh

      # The website's install script (site/public/install.sh) on this package, the way people run
      # it: it checks the DMG against sparkle.json with the (here, throwaway) update key before
      # installing, and refuses a DMG whose signature doesn't match. The second run replaces the
      # first copy.
      - name: Install with the install script
        env:
          LADLE_DOWNLOAD_BASE: file://${{ env.LADLE_OUT }}
          LADLE_PUBLIC_ED_KEY: ${{ env.LADLE_PUBLIC_ED_KEY_OVERRIDE }}
        run: |
          apps="$RUNNER_TEMP/Applications"
          bash site/public/install.sh --dir "$apps" --browser none --no-open
          bash site/public/install.sh --dir "$apps" --browser none --no-open
          tampered="$RUNNER_TEMP/tampered"
          mkdir -p "$tampered"
          cp "$LADLE_OUT/Ladle-Chrome-Extension.zip" "$LADLE_OUT/sparkle.json" "$tampered/"
          cp "$LADLE_OUT/Ladle.dmg" "$tampered/Ladle.dmg"
          # One byte changed, the size kept: only the signature check can tell.
          printf 'x' | dd of="$tampered/Ladle.dmg" bs=1 seek=4096 conv=notrunc 2> /dev/null
          if LADLE_DOWNLOAD_BASE="file://$tampered" bash site/public/install.sh --dir "$RUNNER_TEMP/Tampered" --app-only --no-open 2> /dev/null; then
            echo "::error::The script installed a DMG that doesn't match the release's signature."
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/Tampered/Ladle.app"
          app="$apps/Ladle.app"
          codesign --verify --deep --strict "$app"
          if xattr -p com.apple.quarantine "$app" > /dev/null 2>&1; then
            echo "::error::The installed Ladle is quarantined, so macOS would ask on its first launch."
            exit 1
          fi
          installed=$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")
          if [ "$installed" != "$LADLE_VERSION" ]; then
            echo "::error::The script installed Ladle $installed, not $LADLE_VERSION."
            exit 1
          fi
          leftovers=$(find "$apps" -mindepth 1 -maxdepth 1 ! -name Ladle.app)
          if [ -n "$leftovers" ]; then
            echo "::error::The script left files behind: $leftovers"
            exit 1
          fi
          manifest="$HOME/Library/Application Support/Ladle/Ladle-Chrome-Extension/manifest.json"
          if ! grep -q '"key"' "$manifest"; then
            echo "::error::$manifest is missing, or has no development key to pin the extension's ID."
            exit 1
          fi
          echo "Installed Ladle $installed and the extension $(plutil -extract version raw -o - "$manifest" 2> /dev/null || echo '(version unread)')"
          if bash site/public/install.sh --no-such-option 2> /dev/null; then
            echo "::error::The script accepted an unknown option."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Ladle-dry-run-${{ github.run_number }}
          path: |
            app/build/package/Ladle.dmg
            app/build/package/Ladle-Chrome-Extension.zip
            app/build/package/sparkle.json
          retention-days: 3
          if-no-files-found: error
